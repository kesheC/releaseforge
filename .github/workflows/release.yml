name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Gate: the tag must match the package.json version before any gh call.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG != package.json $PKG" && exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm pack
      - name: Rename tarball to stable asset name
        run: cp $(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'") releaseforge.tgz
      - name: sha256
        run: sha256sum releaseforge-*.tgz releaseforge.tgz > SHA256SUMS.txt
      - name: Extract release notes
        run: |
          # Anchor to THIS tag's section: the first "## [" heading used to be
          # grabbed blindly, which shipped the [Unreleased] "nothing yet" body
          # as the v0.1.1 notes when Unreleased still sat above the release.
          TAG="${GITHUB_REF_NAME#v}"
          # Fence-aware: a "## [x.y.z]" line inside a code fence is an example,
          # not a section boundary. CommonMark closes a fence only with a run
          # of the SAME character at least as long as the opener, so the
          # tracker below records both.
          awk -v v="$TAG" '
            {
              inside = (fence != "")
              if (match($0, /^[[:space:]]*(`{3,}|~{3,})/)) {
                marker = substr($0, RSTART, RLENGTH)
                gsub(/^[[:space:]]+/, "", marker)
                ch = substr(marker, 1, 1)
                if (fence == "") { fence = ch; flen = length(marker) }
                else if (ch == fence && length(marker) >= flen) { fence = ""; flen = 0 }
              }
              if (found && !inside && $0 ~ /^## \[/) { exit }
              if (!inside && index($0, "## [" v "]") == 1) { found=1; print; next }
              if (found) { print }
            }
          ' CHANGELOG.md > notes.md
          if ! head -n 1 notes.md | grep -q "## \[$TAG\]"; then
            echo "CHANGELOG.md has no ## [$TAG] section; refusing to ship wrong notes" && exit 1
          fi
          head -n 40 notes.md > body.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file body.md \
            || gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file body.md
          gh release upload "$GITHUB_REF_NAME" releaseforge-*.tgz releaseforge.tgz SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Read back asset names
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'